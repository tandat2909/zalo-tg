# Local Telegram Bot API Server
# Tài liệu: https://core.telegram.org/bots/api#using-a-local-bot-api-server
#
# Lợi ích:
#   - Upload file lên đến 2 GB (thay vì 50 MB)
#   - Download file lên đến 2 GB (thay vì 20 MB)
#   - Bot có thể nhận webhook qua HTTP
#
# Yêu cầu:
#   - TG_API_ID và TG_API_HASH: lấy tại https://my.telegram.org/apps
#     (chỉ cần cho local-bot-api server; chính bot không bắt buộc dùng local API)
#
# Khởi động lần đầu:
#   1. Copy .env.example → .env và điền TG_TOKEN, TG_GROUP_ID (+ TG_API_ID/HASH nếu dùng local API)
#   2. docker compose up -d --build
#   3. (Nếu muốn migrate sang local API)
#      curl "https://api.telegram.org/bot<TOKEN>/logOut"
#      rồi đặt LOCAL_BOT_API=1 và TG_LOCAL_SERVER=http://telegram-bot-api:8081 trong .env
#
# Dữ liệu bền vững (một volume mount duy nhất ./data ↔ /data):
#   - data/topics.json          map topic ↔ Zalo
#   - data/msg-map.json.gz      lịch sử msgId để reply/quote
#   - data/user-cache.json.gz   uid ↔ tên hiển thị
#   - data/reminders.json       cấu hình /remind & /autoreply
#   - data/credentials.json     phiên Zalo đã đăng nhập (tạo sau lần /login đầu tiên)

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: zalo-tg:latest
    container_name: zalo-tg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override để bot ghi vào volume mount thay vì ./data tương đối
      DATA_DIR: /data
      ZALO_CREDENTIALS_PATH: /data/credentials.json
      # Nếu LOCAL_BOT_API=1 trong .env, service "telegram-bot-api" (profile local-api)
      # phải được khởi động kèm: docker compose --profile local-api up -d --build
      TG_LOCAL_SERVER: ${TG_LOCAL_SERVER:-http://telegram-bot-api:8081}
    volumes:
      - ./data:/data
    # Bot chỉ outbound polling, không cần expose port

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    profiles: ["local-api"]   # chỉ chạy khi: docker compose --profile local-api up
    environment:
      TELEGRAM_API_ID:   "${TG_API_ID}"
      TELEGRAM_API_HASH: "${TG_API_HASH}"
    command: --dir=/data --temp-dir=/tmp
    volumes:
      - telegram-bot-api-data:/data
      - /tmp:/tmp
    ports:
      - "${TG_LOCAL_PORT:-8081}:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  telegram-bot-api-data:
